name: Release

# Stage 2 of the two-stage distribution pipeline: this repo receives mirrored commits
# from Shiyld's private monorepo on an ongoing basis (safe, no publish side effect).
# Publishing only ever happens here, and only when a real GitHub Release is cut on
# THIS repo — never automatically on a plain commit/push.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: npm install
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
